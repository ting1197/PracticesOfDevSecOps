# Role for Prometheus - needs access to discover and scrape pods
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-role
  namespace: ecommerce
  labels:
    app: prometheus
    part-of: ecommerce
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
# Minimal role for frontend - no K8s API access needed
apiVersion: rbac.authorization.k8s.io/v1
