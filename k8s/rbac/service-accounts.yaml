# Service Accounts for all microservices
# Each service gets its own SA following the principle of least privilege
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: ecommerce
  labels:
    app: frontend
    part-of: ecommerce
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service-sa
  namespace: ecommerce
  labels:
    app: order-service
    part-of: ecommerce
automountServiceAccountToken: false
---
