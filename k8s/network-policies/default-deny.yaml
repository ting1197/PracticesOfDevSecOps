# Default deny all ingress and egress traffic in the ecommerce namespace.
# All traffic must be explicitly allowed by other NetworkPolicy resources.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ecommerce
  labels:
    part-of: ecommerce
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
