name: DevSecOps CI Pipeline

on:
  push:
    branches:
      - '**'

jobs:
  # 5. Secret Scan
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 5. Static Code Scan
  sast-codeql:
    name: SAST Scan (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # 1~4, 6. Build, Test, and Vuln Scan
  build-test-scan:
    name: Build, Test & Scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      matrix:
        service: ['frontend', 'inventory-service', 'order-service']
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.service }}/package-lock.json'

      # 1. Install dependencies
      - name: Install dependencies
        working-directory: ./${{ matrix.service }}
        run: npm ci

      # 2. Run tests
      - name: Run tests
        working-directory: ./${{ matrix.service }}
        run: npm test

      # 3. Build or package (Docker build)
      - name: Build Docker Image
        working-directory: ./${{ matrix.service }}
        run: docker build -t myapp-${{ matrix.service }}:${{ github.sha }} .

      # 4. Dependency vulnerability scan
      - name: Dependency Vulnerability Scan (Trivy FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './${{ matrix.service }}'
          format: 'sarif'
          output: 'trivy-results-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'

      # 6. Upload scan result
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results-${{ matrix.service }}.sarif'
          category: trivy-${{ matrix.service }}
